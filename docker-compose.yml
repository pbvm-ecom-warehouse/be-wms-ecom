# Hạ tầng dev: chỉ Redis (BullMQ). MongoDB dùng Atlas.
#   docker compose up -d
services:
  redis:
    image: redis:7-alpine
    container_name: wms-ecom-redis
    # Dev không đặt password; production hãy thêm: command: ['redis-server', '--requirepass', '<pass>']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
