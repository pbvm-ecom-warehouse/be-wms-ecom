# Hạ tầng PRODUCTION (DO VPS): 3 app NestJS (Docker) + Redis (BullMQ).
# MongoDB dùng Atlas (managed, có sẵn replica set) — KHÔNG chạy Mongo ở đây.
# nginx KHÔNG ở đây — dùng reverse proxy có sẵn (network ngoài `proxy-network`).
# Route ở nginx thật (paste vào server block đã có TLS):
#   location /api/wms/  { proxy_pass http://wms:3001; ... }        # WMS
#   location /api/shop/ { proxy_pass http://ecommerce:3002; ... }  # Ecommerce
#   (kèm header: Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto)
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# --env-file .env.production: 1 nguồn duy nhất cho cả ${...} (redis password)
# lẫn env_file của app. Yêu cầu REDIS_PASSWORD trong .env.production.
services:
  wms:
    build: .
    image: wms-ecom-be:latest # build 1 lần, 3 container tái dùng
    command: node dist/apps/wms/main
    env_file: .env.production
    environment:
      - REDIS_HOST=redis # override localhost (redis = tên service trong network)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, proxy] # proxy → nginx gọi http://wms:3001
    # KHÔNG publish ports: nginx vào qua network, app không lộ ra host/internet

  ecommerce:
    image: wms-ecom-be:latest
    command: node dist/apps/ecommerce/main
    env_file: .env.production
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, proxy] # nginx gọi http://ecommerce:3002

  notification:
    image: wms-ecom-be:latest
    command: node dist/apps/notification/main
    env_file: .env.production
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal] # consumer thuần, không public → không cần proxy

  redis:
    image: redis:7-alpine
    container_name: wms-ecom-redis
    restart: unless-stopped
    # appendonly: restart không mất sạch job đang chờ. requirepass: bắt buộc auth.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - '${REDIS_PASSWORD:?REDIS_PASSWORD bắt buộc cho prod}'
    # App chạy Docker → redis chỉ ở network nội bộ, KHÔNG publish ra host.
    networks: [internal]
    environment:
      # để healthcheck `redis-cli ping` tự auth, không lộ password trong args.
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal: # nội bộ project: app ↔ redis
  proxy: # network có sẵn của nginx reverse proxy
    external: true
    name: proxy-network

volumes:
  redis-data:
