# Hạ tầng PRODUCTION (DO VPS): CHỈ Redis (hàng đợi BullMQ).
# MongoDB dùng Atlas (managed, có sẵn replica set) — KHÔNG chạy Mongo ở đây.
#   docker compose -f docker-compose.prod.yml up -d
# Yêu cầu REDIS_PASSWORD trong .env (hoặc shell env) — thiếu là container không khởi động.
services:
  redis:
    image: redis:7-alpine
    container_name: wms-ecom-redis
    restart: unless-stopped
    # appendonly: restart không mất sạch job đang chờ. requirepass: bắt buộc auth.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - '${REDIS_PASSWORD:?REDIS_PASSWORD bắt buộc cho prod}'
    # Chỉ bind loopback: app chạy trên CÙNG VPS (PM2/host) gọi qua localhost.
    # KHÔNG mở 6379 ra internet. (Nếu app chạy trong Docker, xem ghi chú bên dưới.)
    ports:
      - '127.0.0.1:6379:6379'
    environment:
      # để healthcheck `redis-cli ping` tự auth, không lộ password trong args.
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:

# Ghi chú: nếu 3 app NestJS cũng chạy bằng Docker (không phải PM2/host), bỏ binding
# 127.0.0.1 ở trên, cho redis + các app vào CHUNG một docker network, rồi app dùng
# REDIS_HOST=redis (tên service) thay vì localhost. Vẫn KHÔNG publish port ra host.
